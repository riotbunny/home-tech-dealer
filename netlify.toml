[build]
  command = "npm run build"
  publish = "dist"

# Single Page Application (SPA) routing for dynamic 44k pSEO routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache control for high performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=86400"
